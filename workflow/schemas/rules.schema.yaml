$schema: "http://json-schema.org/draft-04/schema#"
description: snakemake rule input and output files description file
type: object
properties:
  cnv_sv_cnvkit_batch:
    type: object
    description: rule to run cnvkit batch on a sample using a pre-built normal reference
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          bam:
            type: string
            description: merged bam file for the sample
          bai:
            type: string
            description: bai index for the input bam
          reference:
            type: string
            description: cnvkit normal reference file (.cnn)
      output:
        type: object
        description: list of outputs
        properties:
          antitarget_coverage:
            type: string
            description: antitarget coverage cnn file
          bins:
            type: string
            description: bin-level copy number segment test file (.cns)
          regions:
            type: string
            description: bin-level log2 copy ratios (.cnr)
          segments:
            type: string
            description: segmented copy number file (.cns)
          segments_called:
            type: string
            description: called copy number segments (.call.cns)
          target_coverage:
            type: string
            description: target coverage cnn file

  pindel_processing_add_missing_csq:
    type: object
    description: rule to add any missing CSQ-field to a vep annotated pindel-vcf
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          vcf:
            type: string
            description: gzipped vep-annotaded vcf to be corrected for missing CSQ
          tbi:
            type: string
            description: tbi index to input.vcf
      output:
        type: object
        description: list of outputs
        properties:
          vcf:
            type: string
            description: annotated vcf file with blank CSQ if needed

  pindel_processing_annotation_vep:
    type: object
    description: rule to annotate pindel-vcfs with vep
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          cache:
            type: string
            description: path to vep cache directory from config["vep"]["vep_cache"]
          fasta:
            type: string
            description: path to fasta reference genome
          tabix:
            type: string
            description: pindel-vcf index file
          vcf:
            type: string
            description: gzipped pindel-vcf file to be annotated
      output:
        type: object
        description: list of outputs
        properties:
          vcf:
            type: string
            description: annotated (or in case of no calls in input just copied) vcf file

  pindel_processing_artifact_annotation:
    type: object
    description: rule to annotate pindel-vcfs with artifact-calls from a panel
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          vcf:
            type: string
            description: gzipped vcf to be artifact annotated
          tbi:
            type: string
            description: tbi index to input.vcf
          artifacts:
            type: string
            description: tsv file with artifact pindel calls, created in reference pipeline
      output:
        type: object
        description: list of outputs
        properties:
          vcf:
            type: string
            description: vcf with artifact annotation

  pindel_processing_fix_af:
    type: object
    description: rule to add AF and DP field in pindel vcf files
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          vcf:
            type: string
            description: vcf where AF and DP is needed in INFO field
      output:
        type: object
        description: list of outputs
        properties:
          vcf:
            type: string
            description: vcf with added AF and DP in INFO field

  reference_rules_create_artifact_file_pindel:
    type: object
    description: rule to create artifact_panel from annotated pindel-vcfs
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          vcfs:
            type: string
            description: all (gzipped) vcfs to be used for artifact panel
          tbis:
            type: string
            description: tbi index to all input vcfs
      output:
        type: object
        description: list of outputs
        properties:
          artifact_panel:
            type: string
            description: tsv file with chr, pos, svtype, median, sd, num_obs of detected variants

  svdb_merge_wo_priority:
    type: object
    description: input and output parameters for svdb_merge_wo_priority
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          vcfs:
            type: string
            description: a function get_vcfs_for_svdb_merge (common.smk) is used to list all files (eg. from different callers) that should be merge into a SVDB 'vcf'
      output:
        type: object
        description: list of outputs
        properties:
          vcf:
            type: string
            description: a 'vcf' file containing the merged SV calls
