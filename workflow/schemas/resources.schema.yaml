$schema: http://json-schema.org/draft-04/schema#
description: snakemake configuration file
type: object
properties:
  default_resources:
    type: object
    description: Default resources for snakemake rules
    properties:
      mem_mb:
        type: integer
        description: default memory used for a rule
      mem_per_cpu:
        type: integer
        description: default memory used per cpu for a rule
      partition:
        type: string
        description: default partition to use on the cluster for a rule
      queue:
        type: string
        description: default cluster queue for a rule
      threads:
        type: integer
        description: default number of threads that will be used by a rule
      time:
        type: string
        description: default max execution time for a rule

  pindel_processing_add_missing_csq:
    type: object
    description: resource definitions for pindel_processing_add_missing_csq
    properties:
      mem_mb:
        type: integer
        description: max memory in MB to be available
      mem_per_cpu:
        type: integer
        description: memory in MB used per cpu
      partition:
        type: string
        description: partition to use on cluster
      queue:
        type: string
        description: queue to use on cluster
      threads:
        type: integer
        description: number of threads to be available
      time:
        type: string
        description: max execution time

  pindel_processing_annotation_vep:
    type: object
    description: resource definitions for pindel_processing_annotation_vep, all
      resources taken from config["vep"]
    properties:
      mem_mb:
        type: integer
        description: max memory in MB to be available
      mem_per_cpu:
        type: integer
        description: memory in MB used per cpu
      partition:
        type: string
        description: partition to use on cluster
      queue:
        type: string
        description: queue to use on cluster
      threads:
        type: integer
        description: number of threads to be available
      time:
        type: string
        description: max execution time

  pindel_processing_artifact_annotation:
    type: object
    description: resource definitions for pindel_processing_artifact_annotation
    properties:
      mem_mb:
        type: integer
        description: max memory in MB to be available
      mem_per_cpu:
        type: integer
        description: memory in MB used per cpu
      partition:
        type: string
        description: partition to use on cluster
      queue:
        type: string
        description: queue to use on cluster
      threads:
        type: integer
        description: number of threads to be available
      time:
        type: string
        description: max execution time

  pindel_processing_fix_af:
    type: object
    description: resource definitions for pindel_processing_fix_af
    properties:
      mem_mb:
        type: integer
        description: max memory in MB to be available
      mem_per_cpu:
        type: integer
        description: memory in MB used per cpu
      partition:
        type: string
        description: partition to use on cluster
      queue:
        type: string
        description: queue to use on cluster
      threads:
        type: integer
        description: number of threads to be available
      time:
        type: string
        description: max execution time

  reference_rules_create_artifact_file_pindel:
    type: object
    description: parameters for reference_rules_create_artifact_file_pindel
    properties:
      benchmark_repeats:
        type: integer
        description: set number of times benchmark should be repeated
      container:
        type: string
        description: name or path to docker/singularity container
      extra:
        type: string
        description: parameters that should be forwarded

  report_tabix_vcf:
    type: object
    description: resource definitions for report_tabix_vcf (standalone mode only)
    properties:
      queue:
        type: string
        description: queue to use on cluster
      threads:
        type: integer
        description: number of threads to be available

  report_mosdepth:
    type: object
    description: resource definitions for report_mosdepth (standalone mode only)
    properties:
      queue:
        type: string
        description: queue to use on cluster
      threads:
        type: integer
        description: number of threads to be available

  report_bedtools_intersect:
    type: object
    description: resource definitions for report_bedtools_intersect
    properties:
      queue:
        type: string
        description: queue to use on cluster
      threads:
        type: integer
        description: number of threads to be available

  results_report:
    type: object
    description: resource definitions for report_xlsx
    properties:
      queue:
        type: string
        description: queue to use on cluster
      threads:
        type: integer
        description: number of threads to be available

  svdb_merge:
    type: object
    description: resource definitions for svdb_merge_wo_priority
    properties:
      mem_mb:
        type: integer
        description: max memory in MB to be available
      mem_per_cpu:
        type: integer
        description: memory in MB used per cpu
      partition:
        type: string
        description: partition to use on cluster
      queue:
        type: string
        description: queue to use on cluster
      threads:
        type: integer
        description: number of threads to be available
      time:
        type: string
        description: max execution time

  required:
    - default_resources
