---
resources: "{{POPPY_HOME}}/config/resources.yaml"
samples: "samples.tsv"
units: "units.tsv"
output: "{{POPPY_HOME}}/config/output_files.yaml"
general_report: "{{POPPY_HOME}}/config/output_files.yaml" # Not used but required from reports module v2.0.0

default_container: "docker://hydragenetics/common:4.1.1"

trimmer_software: "fastp_pe"

modules:
  alignment: v0.8.0
  annotation: v1.4.1
  cnv_sv: v3.2.1
  filtering: v1.1.0
  prealignment: v1.4.0
  qc: v0.8.0
  reports: v2.0.0
  snv_indels_gms: v2.1.0

reference:
  design_intervals_gatk_cnv: "{{REFERENCE_DIRECTORY}}/reference_files/design.preprocessed.interval_list"
  artifacts: "{{REFERENCE_DIRECTORY}}/reference_files/artifact_panel.tsv"
  artifacts_pindel: "{{REFERENCE_DIRECTORY}}/reference_files/artifact_panel_pindel.tsv"
  background: "{{REFERENCE_DIRECTORY}}/reference_files/background_panel.tsv"

annotate_cnv:
  cnv_genes: "{{POPPY_HOME}}/config/cnv_genes.GRCh38.bed"
  germline: "{{POPPY_HOME}}/config/cnv_genes.GRCh38.bed"

bcbio_variation_recall_ensemble:
  container: "docker://hydragenetics/bcbio-vc:0.2.6"
  callers:
    - gatk_mutect2
    - vardict

bwa_mem:
  container: "docker://hydragenetics/bwa_mem:0.7.17"

cnv_html_report:
  cytobands: false
  show_table: true

cnvkit_batch:
  container: "docker://hydragenetics/cnvkit:0.9.13"
  normal_reference: "{{REFERENCE_DIRECTORY}}/reference_files/cnvkit.PoN.cnn"
  method: hybrid

cnvkit_call:
  container: "docker://hydragenetics/cnvkit:0.9.13"

cnvkit_vcf:
  container: "docker://hydragenetics/cnvkit:0.9.13"
  hom_del_limit: 0.47
  het_del_limit: 1.68
  dup_limit: 2.3

fastp_pe:
  container: "docker://hydragenetics/fastp:0.24.3"

fastqc:
  container: "docker://hydragenetics/fastqc:0.11.9"

filter_vcf:
  germline: "{{POPPY_HOME}}/config/filters/config_hard_filter_germline.yaml"
  somatic: "{{POPPY_HOME}}/config/filters/config_soft_filter_somatic.yaml"
  somatic_hard: "{{POPPY_HOME}}/config/filters/config_hard_filter_somatic.yaml"
  pindel: "{{POPPY_HOME}}/config/filters/config_soft_filter_pindel.yaml"
  cnv_hard_filter: "{{POPPY_HOME}}/config/filters/config_hard_filter_cnv.yaml"
  cnv_filter: "{{POPPY_HOME}}/config/filters/config_hard_filter_cnv_report.yaml"

gatk_collect_allelic_counts:
  container: "docker://hydragenetics/gatk4:4.6.2.0"

gatk_collect_read_counts:
  container: "docker://hydragenetics/gatk4:4.6.2.0"

gatk_denoise_read_counts:
  container: "docker://hydragenetics/gatk4:4.6.2.0"
  normal_reference: "{{REFERENCE_DIRECTORY}}/reference_files/gatk.PoN.hdf5"

gatk_model_segments:
  container: "docker://hydragenetics/gatk4:4.6.2.0"

gatk_mutect2:
  container: "docker://hydragenetics/gatk4:4.6.2.0"

gatk_mutect2_filter:
  container: "docker://hydragenetics/gatk4:4.6.2.0"

gatk_mutect2_gvcf:
  container: "docker://hydragenetics/gatk4:4.6.2.0"

gatk_mutect2_merge_stats:
  container: "docker://hydragenetics/gatk4:4.6.2.0"

merge_cnv_json:
  annotations:
    - "{{POPPY_HOME}}/config/cnv_genes.GRCh38.bed"
  germline_vcf: snv_indels/bcbio_variation_recall_ensemble/{sample}_{type}.ensembled.vep_annotated.filter.germline.vcf.gz
  germline_vcf_tbi: snv_indels/bcbio_variation_recall_ensemble/{sample}_{type}.ensembled.vep_annotated.filter.germline.vcf.gz.tbi
  filtered_cnv_vcfs:
    - cnv_sv/svdb_query/{sample}_{type}.{tc_method}.svdb_query.annotate_cnv.cnv_genes.filter.cnv_hard_filter.vcf.gz
  filtered_cnv_vcf_tbis:
    - cnv_sv/svdb_query/{sample}_{type}.{tc_method}.svdb_query.annotate_cnv.cnv_genes.filter.cnv_hard_filter.vcf.gz.tbi
  unfiltered_cnv_vcfs:
    - cnv_sv/svdb_query/{sample}_{type}.{tc_method}.svdb_query.annotate_cnv.cnv_genes.vcf.gz
  unfiltered_cnv_vcfs_tbi:
    - cnv_sv/svdb_query/{sample}_{type}.{tc_method}.svdb_query.annotate_cnv.cnv_genes.vcf.gz.tbi
  table_filter_config: "{{POPPY_HOME}}/config/filters/table_filter.yaml"

mosdepth_bed:
  container: "docker://hydragenetics/mosdepth:0.3.6"
  thresholds: "100,200,1000"
  extra: " --mapq 20 "

multiqc:
  container: "docker://hydragenetics/multiqc:1.27.1"
  reports:
    DNA:
      config: "{{POPPY_HOME}}/config/config_multiqc.yaml"
      included_unit_types:
        - T
        - N
      qc_files:
        - "qc/fastqc/{sample}_{type}_{flowcell}_{lane}_{barcode}_{read}_fastqc.zip"
        - "prealignment/fastp_pe/{sample}_{type}_{flowcell}_{lane}_{barcode}_fastp.json"
        - "qc/mosdepth_bed/{sample}_{type}.mosdepth.summary.txt"
        - "qc/mosdepth_bed/{sample}_{type}.per-base.bed.gz"
        - "qc/mosdepth_bed/{sample}_{type}.mosdepth.region.dist.txt"
        - "qc/mosdepth_bed/{sample}_{type}.regions.bed.gz"
        - "qc/mosdepth_bed/{sample}_{type}.thresholds.bed.gz"
        - "qc/picard_collect_hs_metrics/{sample}_{type}.HsMetrics.txt"
        - "qc/picard_collect_alignment_summary_metrics/{sample}_{type}.alignment_summary_metrics.txt"
        - "qc/picard_collect_duplication_metrics/{sample}_{type}.duplication_metrics.txt"
        - "qc/picard_collect_insert_size_metrics/{sample}_{type}.insert_size_metrics.txt"
        - "qc/picard_collect_gc_bias_metrics/{sample}_{type}.gc_bias.summary_metrics"
        - "qc/samtools_stats/{sample}_{type}.samtools-stats.txt"

picard_collect_alignment_summary_metrics:
  container: "docker://hydragenetics/picard:2.25.4"

picard_collect_duplication_metrics:
  container: "docker://hydragenetics/picard:2.25.4"

picard_collect_gc_bias_metrics:
  container: "docker://hydragenetics/picard:2.25.4"

picard_collect_hs_metrics:
  container: "docker://hydragenetics/picard:2.25.4"

picard_collect_insert_size_metrics:
  container: "docker://hydragenetics/picard:2.25.4"

picard_mark_duplicates:
  container: "docker://hydragenetics/picard:2.25.4"

normalize_pindel_insert_size_metrics:
  min_insert_size: 200
  replace_insert_size: 250

pindel_call:
  container: "docker://hydragenetics/pindel:0.2.5b9"
  extra: "-x 2 -B 60"

pindel_update_vcf:
  container: "docker://hydragenetics/picard:2.25.4"

pindel2vcf:
  container: "docker://hydragenetics/pindel:0.2.5b9"
  extra: "-e 10 -mc 10 -is 5 -he 0.01 -G"

purecn:
  container: docker://hydragenetics/purecn:2.2.0
  interval_padding: 100
  segmentation_method: internal
  fun_segmentation: PSCBS
  extra: "--model betabin --post-optimize"
  normaldb: "{{REFERENCE_DIRECTORY}}/reference_files/purecn_normal_db.rds"
  intervals: "{{REFERENCE_DIRECTORY}}/reference_files/purecn_targets_intervals.txt"
  mapping_bias_file: "{{REFERENCE_DIRECTORY}}/reference_files/purecn_mapping_bias.rds"

purecn_coverage:
  container: docker://hydragenetics/purecn:2.2.0
  intervals: "{{REFERENCE_DIRECTORY}}/reference_files/purecn_targets_intervals.txt"

svdb_merge:
  container: docker://hydragenetics/svdb:2.10.2
  tc_method:
    - name: purecn
      cnv_caller:
        - cnvkit
        - gatk
    - name: pathology
      cnv_caller:
        - cnvkit
        - gatk

svdb_query:
  container: docker://hydragenetics/svdb:2.10.2
  db_string: "--db {{REFERENCE_DIRECTORY}}/reference_files/svdb_cnv.vcf --out_frq Normal_AF --out_occ Normal_OCC"

vardict:
  container: "docker://hydragenetics/vardict:1.8.3"
  extra: " -Q 1 --nosv "
  bed_columns: "-c 1 -S 2 -E 3"

vep:
  container: "docker://hydragenetics/vep:113.0"
  mode: "--offline --cache --merged "
  extra: " --assembly GRCh38 --check_existing --pick --variant_class --everything --buffer_size 1500 --pick_order mane_select,mane_plus_clinical,canonical,biotype,rank,appris,tsl,ccds,length,ensembl,refseq"

vt_decompose:
  container: "docker://hydragenetics/vt:2015.11.10"

vt_normalize:
  container: "docker://hydragenetics/vt:2015.11.10"
