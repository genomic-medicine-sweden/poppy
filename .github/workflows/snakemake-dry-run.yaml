name: Snakemake dry run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  snakemake-dry-run:
    name: Run snakemake dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: 3.8
      - name: Install requirements.txt
        run: |
          pip install -r requirements.txt
      - name: snakemake dry run
        working-directory: .tests/integration
        run: |
          snakemake -n -s ../../workflow/Snakefile \
            --configfile ../../config/config_static.yaml config/config_custom_test.yaml \
            --config POPPY_HOME=../.. REFERENCE_DIRECTORY=data
      - name: snakemake reference pipeline dry run
        working-directory: .tests/integration
        run: |
          snakemake -n -s ../../workflow/Snakefile_references.smk \
            --configfile ../../config/config_static.yaml config/config_custom_test.yaml \
            ../../config/config_references_pipeline_static.yaml config/config_references_pipeline_custom_test.yaml \
            --config POPPY_HOME=../.. REFERENCE_DIRECTORY=.
